<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UKA Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">UKA</div>
        <div>
          <h1 class="brand-title">Knowledge Clipper</h1>
          <p class="brand-subtitle">Universal Artifact v0.1</p>
        </div>
      </div>
      <button id="btn-open-sidepanel" class="icon-btn" title="Open Side Panel Inspector" aria-label="Open Side Panel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
    </header>

    <!-- Page Metadata Card -->
    <main class="content-card">
      <div class="page-meta">
        <h2 id="page-title" class="page-title">Detecting page...</h2>
        <div id="page-url" class="page-url">--</div>
      </div>

      <div class="stats-grid">
        <div class="stat-pill">
          <span class="stat-label">Words</span>
          <span id="stat-words" class="stat-value">--</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Entities</span>
          <span id="stat-entities" class="stat-value">--</span>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Media</span>
          <span id="stat-media" class="stat-value">--</span>
        </div>
      </div>

      <!-- Domain Ontology Selector -->
      <div class="form-group">
        <label for="domain-select" class="form-label">Domain Ontology</label>
        <div class="select-wrapper">
          <select id="domain-select" class="form-select">
            <option value="healthtech" selected>Healthcare / Clinical (EHR, ICD)</option>
            <option value="fintech">Financial / Markets (SEC, Ticker)</option>
            <option value="general">General Enterprise Knowledge</option>
          </select>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="button-stack">
        <button id="btn-download-uka" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Package &amp; Download .UKA
        </button>

        <button id="btn-sync-platform" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 16 12 12 8 16"></polyline>
            <line x1="12" y1="12" x2="12" y2="21"></line>
            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"></path>
          </svg>
          Sync to CKP Platform
        </button>
      </div>

      <!-- Dynamic Feedback / Progress Alert -->
      <div id="status-box" class="status-box hidden" role="status">
        <div id="status-icon" class="status-icon"></div>
        <div class="status-content">
          <div id="status-title" class="status-title"></div>
          <div id="status-desc" class="status-desc"></div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="backend-status">
        <span class="status-dot connected"></span>
        <span id="backend-label" class="backend-label">CKP: localhost:8000</span>
      </div>
      <button id="btn-settings" class="text-btn">Settings</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
