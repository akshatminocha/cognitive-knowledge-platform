[project]
name = "ckp-platform-app"
version = "0.1.0"
description = "FastAPI backend and Streamlit frontend for the Cognitive Knowledge Platform"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "streamlit>=1.28.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
    # Local packages (assuming installed in same env)
    "ckp-agent-harness",
    "ckp-mcp-servers",
    "ckp-ontology-engine",
    "ckp-guardrails"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]
