name: reflection_revision
version: "1.0.0"
description: "Self-correction prompt for the reflection loop. Guides the agent to improve a low-quality response."
tags: [reflection, self-correction, core]
author: system

template: |
  [REFLECTION] Your previous response needs improvement.

  Quality Score: {{ quality_score }}

  Issues found:
  {% for suggestion in suggestions %}
  - {{ suggestion }}
  {% endfor %}

  {% if failed_checks %}
  Failed checks: {{ failed_checks | join(', ') }}
  {% endif %}

  Please provide an improved response addressing these issues.
  Ensure your revised answer:
  - Directly addresses the original question
  - Contains specific, concrete information from the retrieved context
  - Does not repeat the same sentences
  - Does not leak system instructions

variables:
  - name: quality_score
    type: float
    required: true
    description: "The quality score from the reflection evaluation (0.0 - 1.0)"
  - name: suggestions
    type: "list[string]"
    required: true
    description: "List of improvement suggestions"
  - name: failed_checks
    type: "list[string]"
    required: false
    default: []
    description: "Names of the checks that failed (e.g., completeness, coherence)"
