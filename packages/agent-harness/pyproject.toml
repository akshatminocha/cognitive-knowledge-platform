[project]
name = "ckp-agent-harness"
version = "0.1.0"
description = "Agent Harness — Google ADK-based execution runtime with model-agnostic context engine, semantic memory, reflection loop, configurable guardrails, and evaluation benchmarks."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "google-adk>=2.6",
    "ckp-ai-gateway",
    "ckp-guardrails",
    "ckp-mcp-servers",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_harness"]
