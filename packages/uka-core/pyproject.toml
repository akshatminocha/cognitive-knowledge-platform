[project]
name = "ckp-uka-core"
version = "0.1.0"
description = "Universal Knowledge Artifact (UKA) Core Standard Engine — Portable, multimodal, and self-describing context bundles."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uka"]
