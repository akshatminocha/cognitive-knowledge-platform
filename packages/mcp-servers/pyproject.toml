[project]
name = "ckp-mcp-servers"
version = "0.1.0"
description = "MCP Tool Servers — FastMCP servers for Graph (Neo4j), Retrieval (Qdrant), and Tabular (PostgreSQL) data access via the Model Context Protocol."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastmcp>=3.0",
    "neo4j>=5.0",
    "qdrant-client>=1.9",
    "asyncpg>=0.29",
    "sentence-transformers>=3.0",
    "ckp-ontology-engine",
    "ckp-guardrails",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_servers"]
