[project]
name = "ckp-uka-mcp-server"
version = "0.1.0"
description = "Universal Knowledge Artifact (UKA) FastMCP Server — Exposes portable .uka knowledge bundles over Model Context Protocol to Claude Desktop, Cursor, and external AI agents."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastmcp>=3.0",
    "ckp-uka-core",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
uka-mcp = "uka_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uka_mcp"]
