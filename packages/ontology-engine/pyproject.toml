[project]
name = "ckp-ontology-engine"
version = "0.1.0"
description = "Schema-Driven Ontology Engine — declarative YAML domain definitions for industry-agnostic knowledge graph construction (Healthtech, Fintech, Edtech, AdTech)."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontology_engine"]
