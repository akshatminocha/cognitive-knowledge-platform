[project]
name = "ckp-guardrails"
version = "0.1.0"
description = "Configurable Guardrails Engine — dynamic PII/PHI/PCI masking (Presidio), Cypher/SQL AST read-only validation, prompt injection detection, and output faithfulness verification."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
spacy = ["spacy>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardrails"]
