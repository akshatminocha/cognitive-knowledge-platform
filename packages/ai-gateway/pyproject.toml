[project]
name = "ckp-ai-gateway"
version = "0.1.0"
description = "LiteLLM-based AI Gateway — multi-model routing, rate limiting (TPM/RPM/TPD/RPD), cost budgeting, and semantic response caching."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "litellm>=1.80",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_gateway"]
