[project]
name = "cognitive-knowledge-platform"
version = "2.0.0"
description = "Production-grade, industry-agnostic AI platform with agentic knowledge intelligence — featuring Agent Harness (Google ADK), AI Gateway, Configurable Guardrails, Schema-Driven Ontology, and MCP Tool Servers."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Akshat Minocha" }
]
dependencies = [
    "ckp-platform-app"
]

[tool.uv.workspace]
members = [
    "packages/ai-gateway",
    "packages/guardrails",
    "packages/ontology-engine",
    "packages/mcp-servers",
    "packages/agent-harness",
    "platform-app"
]

[tool.uv.sources]
ckp-ai-gateway = { workspace = true }
ckp-guardrails = { workspace = true }
ckp-ontology-engine = { workspace = true }
ckp-mcp-servers = { workspace = true }
ckp-agent-harness = { workspace = true }
ckp-platform-app = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
